# JUICE settings (read by juice_gui.py, results_viewer.py, scenario_runner.py and the study tools).
#
# [paths] is intentionally absent: without it JUICE uses the folders inside this repository —
#   easy_root    = MCM_tested_scenarios/IDL Input            (reference experiments)
#   include_dir  = MCM_tested_scenarios/IDL Input/include files   (mechanism include sets)
#   output_root  = MCM_tested_scenarios/JUICE archive/JUICE  (new experiments and results)
# To work elsewhere, create FR_GUI.local.toml next to this file (never committed) with
#   [paths]
#   output_root = "D:\\my experiments"
# Any key in the .local.toml overrides the value here.

[comparison]
favorites = "['OH', 'HO2', 'RO2', 'NO', 'NO2', 'O3', 'Ox', 'NOx', 'NOy', 'HONO', 'kOH', 'HV', 'T', 'k(NO2+HV-->NO+O3)']"

[solver]
# The validated settings (see README: regression against FACSIMILE). Changing these changes results.
# profile: which of the two validated profiles a run uses unless the GUI, a study or --solver picks the other.
#   fast    — rtol 1e-4, warm continuation across ENZ rows. ~2x faster. Every species > 1 ppt within 0.6 %
#             of FACSIMILE (O3/NOx/OH/HO2 within 0.25 %). For O3, SOA and product studies.
#   precise — rtol 1e-6, cold restart at every ENZ row. ~2x slower. Main species within 0.03 % in large
#             mechanisms; rare excursions (up to 5x) in species < 0.01 ppt. For validation and reference runs.
profile = "fast"
rtol_choices = "[0.01, 1e-04, 1e-06]"
hmax = "60.0"
atol = "10000.0"
atol_floor = "100"
step_column_patterns_extra = "[]"
ode_backend = "numba"
# solver_method: BDF (recommended for sub-step mode) or Radau (for continuous mode)
solver_method = "BDF"
# jac_mode: analytic (fastest), none (FD, 56 extra ODE calls/update), sparse (future)
jac_mode = "analytic"
first_step = "1e-6"
interpolation = "piecewise"
kv_pd = "true"
perstep_snap = "true"
# Newton control for sub-step modes (scipy default tol ~1e-3 / 4 iters under-converges trace species)
newton_tol = "1e-6"
newton_maxiter = "10"

# The numbers behind each profile. rtol 1e-6 needs the cold restart: with warm continuation it
# diverges in trace species (HCOCO3 x1400 in scene_06), so never combine the two.
[solver.profiles.fast]
rtol = "1e-04"
perstep_warm = "true"

[solver.profiles.precise]
rtol = "1e-06"
perstep_warm = "false"

[viewer]
quick_plot_left  = "['NO', 'NO2', 'O3']"
quick_plot_right = "['OH', 'HO2']"
