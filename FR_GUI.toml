[paths]
easy_root     = "E:\\Python Code\\JUICE archive\\EASY"
include_dir   = "E:\\Python Code\\JUICE archive\\EASY\\include files"
output_root   = "E:\\Python Code\\JUICE archive\\JUICE"

[comparison]
favorites = "['OH', 'HO2', 'RO2', 'NO', 'NO2', 'O3', 'Ox', 'NOx', 'NOy', 'HONO', 'kOH', 'HV', 'T', 'k(NO2+HV-->NO+O3)']"

[solver]
rtol_choices = "[0.01, 1e-06]"
hmax = "60.0"
atol = "10000.0"
step_column_patterns_extra = "[]"
ode_backend = "numba"
# solver_method: BDF (recommended for sub-step mode) or Radau (for continuous mode)
solver_method = "BDF"
# jac_mode: analytic (fastest), none (FD, 56 extra ODE calls/update), sparse (future)
jac_mode = "analytic"
first_step = "1e-9"
# Bottom-bar defaults restored on every startup
interpolation = "piecewise"
rtol_default = "1e-06"
kv_pd = "true"
perstep_snap = "true"

[viewer]
quick_plot_left  = "['NO', 'NO2', 'O3']"
quick_plot_right = "['OH', 'HO2']"
