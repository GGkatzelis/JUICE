name: tests

# Runs the JUICE test suite (tests/, about 11 min) on every push and pull request to main, with the
# coverage table at the end: unit tests of the single functions, the input side for scene_01..09
# (MCM checksums, EASY round-trip and builder, experiment-description goldens), the importers, a small
# experiment with closed-form answers in every solver profile, scene_04 against FACSIMILE, the UV-lamp
# chamber check, and the windows opened without a screen.  Layers and rules: tests/README.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q --cov --cov-report=term
