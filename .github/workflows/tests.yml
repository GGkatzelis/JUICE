name: tests

# Two jobs (25 Nov 2026; layers and markers in tests/README.md).
#   quick  every push and pull request: the suite without the tests marked slow (the long solver runs), on all
#          cores of the runner.
#   full   every night and on request (Actions tab -> tests -> Run workflow): the whole suite, with coverage.
# A test that runs longer than its limit fails with a stack dump that names it, instead of the job being cancelled
# without a word: every run from 15 to 25 Nov 2026 was cancelled at the old 30-minute job limit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen          # the windows are tested without a screen

jobs:
  quick:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -n auto --timeout=600 -m "not slow"

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -n auto --timeout=1800 --cov --cov-report=term
